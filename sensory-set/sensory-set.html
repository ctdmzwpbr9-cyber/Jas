<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Garden Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #ece8f0; }
  body { color: #4a3a5c; font-family: "Fredoka", system-ui, sans-serif; font-weight: 500; }
  .page {
    width: 8.5in; height: 11in; padding: 0.45in 0.5in 0.55in;
    position: relative; overflow: hidden; background: #fff;
    break-after: page; page-break-after: always;
    display: flex; flex-direction: column;
  }
  .page::before {
    content: ""; position: absolute; inset: 0.2in; border: 2.5px dotted #e6dcef;
    border-radius: 0.3in; pointer-events: none;
  }
  @media screen { .page { margin: 24px auto; box-shadow: 0 4px 24px rgba(74,58,92,.15); } }
  header { text-align: center; margin-bottom: 0.15in; position: relative; }
  .kicker {
    display: inline-block; font-size: 10pt; letter-spacing: .12em; text-transform: uppercase;
    background: #f3ecfa; color: #8a74a8; padding: 3px 12px; border-radius: 99px; font-weight: 600;
  }
  h1 { font-family: "DynaPuff", "Fredoka", sans-serif; font-weight: 600; font-size: 32pt; margin: 4px 0 2px; line-height: 1.05; }
  .how { margin: 2px auto 0; font-size: 11.5pt; max-width: 6.6in; color: #6f6080; line-height: 1.35; }
  .footer {
    position: absolute; bottom: 0.3in; left: 0; right: 0; text-align: center;
    font-size: 8.5pt; color: #b3a6c2; letter-spacing: .04em;
  }
  .grow { flex: 1; display: flex; align-items: center; justify-content: center; }
  svg { display: block; overflow: visible; }

  /* cut lines */
  .cut { border: 2px dashed #c9bdd6; border-radius: 0.18in; position: relative; background: #fff; }
  .scissors { font-size: 13pt; color: #b3a6c2; text-align: left; margin: 0 0 2px 4px; }

  /* cover */
  .cover h1 { font-size: 46pt; margin-top: 10px; }
  .cover .sub { font-size: 15pt; color: #8a74a8; margin-top: 4px; }
  .parade { display: flex; justify-content: center; gap: 2px; margin: 0.2in 0 0.15in; }
  .parade svg { width: 0.78in; height: 0.78in; }
  .boxes { display: grid; grid-template-columns: 1.15fr 1fr; gap: 0.18in; }
  .box { border-radius: 0.2in; padding: 0.14in 0.2in; }
  .box h2 { font-family: "DynaPuff", sans-serif; font-weight: 600; font-size: 15pt; margin: 0 0 6px; }
  .box ul, .box ol { margin: 0; padding-left: 1.15em; font-size: 10.5pt; line-height: 1.45; }
  .box li::marker { color: #b49ae6; }
  .b1 { background: #f6f0fc; grid-row: span 2; }
  .b2 { background: #fff6dc; }
  .b3 { background: #e6f5ff; }
  .b4 { background: #ffeaf2; grid-column: span 2; font-size: 10.5pt; line-height: 1.4; }
  .b4 h2 { font-size: 13pt; }
  .cover .scene { width: 7.2in; }
  .pg { color: #b3a6c2; font-size: 9pt; }

  /* color sort */
  .sortgrid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.1in 0.25in; flex: 1; }
  .sortcell { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .sortcell .pal { width: 1.35in; height: 1.35in; margin-bottom: -0.42in; position: relative; z-index: 2; }
  .sortcell .bowl { width: 3.15in; height: 3.15in; }

  .tokens { display: grid; grid-template-columns: repeat(4, 1.65in); gap: 0.1in 0.2in; justify-content: center; }
  .tokens svg { width: 1.65in; height: 1.65in; }

  /* shadow match */
  .grid3 { display: grid; grid-template-columns: repeat(3, 2.35in); grid-auto-rows: 2.35in; gap: 0.18in; justify-content: center; }
  .slot { border-radius: 0.25in; background: #faf7fd; border: 3px solid #eee6f6; display: flex; align-items: center; justify-content: center; }
  .slot svg { width: 1.75in; height: 1.75in; }
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card svg { width: 1.65in; height: 1.65in; }
  .card .name { font-family: "DynaPuff", sans-serif; font-size: 13pt; margin-top: 2px; }

  /* lacing */
  .grid2 { display: grid; grid-template-columns: repeat(2, 3.6in); grid-auto-rows: 3.6in; gap: 0.2in; justify-content: center; }
  .grid2 .cut { display: flex; align-items: center; justify-content: center; }
  .grid2 svg { width: 3.3in; height: 3.3in; }

  /* tracing */
  .lanes { display: flex; flex-direction: column; gap: 0.12in; flex: 1; justify-content: center; }
  .lane { background: #fcfaff; border-radius: 0.22in; padding: 0.05in 0.08in; }
  .lane svg { width: 100%; height: auto; }

  /* counting */
  .countgrid { display: grid; grid-template-columns: repeat(2, 3.65in); grid-auto-rows: 1.62in; gap: 0.12in 0.16in; justify-content: center; }
  .countcard { display: flex; align-items: center; padding: 0 0.12in; gap: 0.08in; }
  .countcard .num { width: 0.95in; text-align: center; line-height: 1; }
  .countcard .num b { font-family: "DynaPuff", sans-serif; font-weight: 600; font-size: 50pt; display: block; }
  .countcard .num span { font-size: 11pt; letter-spacing: .06em; text-transform: uppercase; color: #8a74a8; }
  .countcard .frame { width: 2.1in; margin-top: 0.2in; }
  .countcard .mini { position: absolute; top: 0.05in; right: 0.08in; width: 0.42in; height: 0.42in; }

  /* dough mats */
  .mat { width: 7.3in; height: auto; }
  .tipbar {
    margin-top: 0.1in; background: #f6f0fc; border-radius: 0.2in; padding: 0.1in 0.2in;
    font-size: 11pt; text-align: center; color: #6f6080;
  }
  .tipbar b { color: #4a3a5c; }
</style>
</head>
<body>
<div id="book"></div>

<script>
const INK = "#4a3a5c";
let uid = 0;
const C = {
  pink: "#ff9ec4", pinkT: "#ffe3ef",
  yellow: "#ffd24d", yellowT: "#fff3c4",
  blue: "#7cc4ff", blueT: "#e0f1ff",
  green: "#7fd77a", greenT: "#e1f7de",
  purple: "#c9a7ff", purpleT: "#efe6ff",
  orange: "#ffad66", red: "#ff7272", cream: "#ffe2c2",
};

const svg = (inner, vb = "0 0 200 200", cls = "") =>
  `<svg class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

// ---------- shared face ----------
function face(cx, cy, s = 1, o = {}) {
  let g = "";
  for (const d of [-1, 1]) {
    g += `<ellipse cx="${cx + d * 30 * s}" cy="${cy + 11 * s}" rx="${8 * s}" ry="${5 * s}" fill="#ff8fb1" opacity=".55"/>`;
  }
  if (!o.noEyes) {
    for (const d of [-1, 1]) {
      const x = cx + d * 17 * s;
      g += `<ellipse cx="${x}" cy="${cy}" rx="${5.5 * s}" ry="${7 * s}" fill="${INK}"/>`;
      g += `<circle cx="${x + 2 * s}" cy="${cy - 3 * s}" r="${2.2 * s}" fill="#fff"/>`;
    }
  }
  if (!o.noMouth) {
    g += `<path d="M${cx - 6 * s} ${cy + 8 * s} Q${cx} ${cy + 15 * s} ${cx + 6 * s} ${cy + 8 * s}" fill="none" stroke="${INK}" stroke-width="${3.2 * s}" stroke-linecap="round"/>`;
  }
  return g;
}

// m = silhouette colour (or null for full colour)
const F = (m, c) => m || c;
const S = (m, w = 5) => `stroke="${m || INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

// ---------- the cast ----------
const critters = {
  bee(m) {
    const id = "cl" + uid++;
    let o = "";
    o += `<path d="M85 64 Q78 42 70 30" fill="none" ${S(m)}/><circle cx="70" cy="28" r="7" fill="${F(m, INK)}"/>`;
    o += `<path d="M115 64 Q122 42 130 30" fill="none" ${S(m)}/><circle cx="130" cy="28" r="7" fill="${F(m, INK)}"/>`;
    o += `<ellipse cx="76" cy="60" rx="24" ry="33" transform="rotate(-25 76 60)" fill="${F(m, "#e6f5ff")}" ${S(m)}/>`;
    o += `<ellipse cx="124" cy="60" rx="24" ry="33" transform="rotate(25 124 60)" fill="${F(m, "#e6f5ff")}" ${S(m)}/>`;
    o += `<path d="M166 108 L190 118 L166 128 Z" fill="${F(m, INK)}" ${S(m, 4)}/>`;
    o += `<clipPath id="${id}"><ellipse cx="100" cy="118" rx="72" ry="56"/></clipPath>`;
    o += `<ellipse cx="100" cy="118" rx="72" ry="56" fill="${F(m, C.yellow)}"/>`;
    if (!m) o += `<g clip-path="url(#${id})" fill="${INK}"><rect x="126" y="50" width="15" height="140" rx="5"/><rect x="152" y="50" width="13" height="140" rx="5"/></g>`;
    o += `<ellipse cx="100" cy="118" rx="72" ry="56" fill="none" ${S(m)}/>`;
    if (!m) o += face(82, 116);
    return o;
  },
  ladybug(m) {
    let o = "";
    o += `<path d="M88 40 Q76 18 60 16" fill="none" ${S(m)}/><circle cx="58" cy="16" r="7" fill="${F(m, INK)}"/>`;
    o += `<path d="M112 40 Q124 18 140 16" fill="none" ${S(m)}/><circle cx="142" cy="16" r="7" fill="${F(m, INK)}"/>`;
    o += `<circle cx="100" cy="62" r="32" fill="${F(m, INK)}" ${S(m)}/>`;
    o += `<circle cx="100" cy="120" r="70" fill="${F(m, C.red)}" ${S(m)}/>`;
    if (!m) {
      o += `<g fill="${INK}"><circle cx="50" cy="104" r="11"/><circle cx="150" cy="104" r="11"/><circle cx="62" cy="156" r="12"/><circle cx="138" cy="156" r="12"/><circle cx="100" cy="174" r="8"/></g>`;
      o += face(100, 118);
    }
    return o;
  },
  snail(m) {
    let o = "";
    o += `<path d="M42 108 Q36 88 30 74" fill="none" ${S(m)}/><circle cx="30" cy="70" r="7" fill="${F(m, INK)}"/>`;
    o += `<path d="M62 108 Q68 88 74 74" fill="none" ${S(m)}/><circle cx="74" cy="70" r="7" fill="${F(m, INK)}"/>`;
    o += `<rect x="24" y="142" width="166" height="38" rx="19" fill="${F(m, "#ffe2ad")}" ${S(m)}/>`;
    o += `<circle cx="52" cy="130" r="32" fill="${F(m, "#ffe2ad")}" ${S(m)}/>`;
    o += `<rect x="40" y="146" width="40" height="30" fill="${F(m, "#ffe2ad")}"/>`;
    o += `<circle cx="128" cy="100" r="54" fill="${F(m, C.purple)}" ${S(m)}/>`;
    if (!m) {
      o += `<path d="M128 100 a10 10 0 0 1 20 0 a20 20 0 0 1 -40 0 a30 30 0 0 1 60 0 a40 40 0 0 1 -80 0" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
      o += face(50, 130, 0.72);
    }
    return o;
  },
  frog(m) {
    let o = "";
    const g = F(m, C.green);
    o += `<circle cx="60" cy="70" r="28" fill="${g}" ${S(m)}/><circle cx="140" cy="70" r="28" fill="${g}" ${S(m)}/>`;
    o += `<ellipse cx="100" cy="130" rx="80" ry="58" fill="${g}" ${S(m)}/>`;
    o += `<circle cx="60" cy="70" r="25.5" fill="${g}"/><circle cx="140" cy="70" r="25.5" fill="${g}"/>`;
    if (!m) {
      for (const x of [60, 140]) {
        o += `<circle cx="${x}" cy="68" r="15" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
        o += `<circle cx="${x + 2}" cy="70" r="8.5" fill="${INK}"/><circle cx="${x + 5}" cy="66" r="2.6" fill="#fff"/>`;
      }
      o += `<ellipse cx="100" cy="158" rx="44" ry="24" fill="#dff7d6"/>`;
      o += `<path d="M72 118 Q100 142 128 118" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
      o += `<ellipse cx="50" cy="122" rx="11" ry="6.5" fill="#ff8fb1" opacity=".55"/><ellipse cx="150" cy="122" rx="11" ry="6.5" fill="#ff8fb1" opacity=".55"/>`;
    }
    return o;
  },
  bunny(m) {
    let o = "";
    for (const [x, r] of [[72, -12], [128, 12]]) {
      o += `<g transform="rotate(${r} ${x} 70)"><ellipse cx="${x}" cy="52" rx="20" ry="46" fill="${F(m, "#fffaf6")}" ${S(m)}/>`;
      if (!m) o += `<ellipse cx="${x}" cy="56" rx="9" ry="32" fill="#ffc2d6"/>`;
      o += `</g>`;
    }
    o += `<circle cx="100" cy="128" r="62" fill="${F(m, "#fffaf6")}" ${S(m)}/>`;
    if (!m) {
      o += face(100, 126);
      o += `<ellipse cx="100" cy="128" rx="5" ry="3.5" fill="#ff8fb1"/>`;
    }
    return o;
  },
  hedgehog(m) {
    let o = "";
    o += `<ellipse cx="80" cy="176" rx="15" ry="9" fill="${F(m, C.cream)}" ${S(m, 4)}/>`;
    o += `<ellipse cx="146" cy="176" rx="15" ry="9" fill="${F(m, C.cream)}" ${S(m, 4)}/>`;
    const cx = 112, cy = 112, N = 22, a0 = 200, a1 = -20;
    let pts = [];
    for (let i = 0; i <= N; i++) {
      const a = (a0 + (a1 - a0) * i / N) * Math.PI / 180;
      const r = i % 2 ? 84 : 62;
      pts.push(`${(cx + r * Math.cos(a)).toFixed(1)} ${(cy - r * Math.sin(a)).toFixed(1)}`);
    }
    o += `<path d="M${pts.join(" L")} Q${cx} 210 ${pts[0]} Z" fill="${F(m, "#c08d60")}" ${S(m)}/>`;
    o += `<ellipse cx="70" cy="130" rx="48" ry="40" fill="${F(m, C.cream)}" ${S(m)}/>`;
    o += `<circle cx="24" cy="134" r="9" fill="${F(m, INK)}"/>`;
    if (!m) o += face(72, 124, 0.85);
    return o;
  },
  butterfly(m) {
    let o = "";
    o += `<path d="M94 38 Q84 16 72 10" fill="none" ${S(m)}/><circle cx="70" cy="9" r="6" fill="${F(m, INK)}"/>`;
    o += `<path d="M106 38 Q116 16 128 10" fill="none" ${S(m)}/><circle cx="130" cy="9" r="6" fill="${F(m, INK)}"/>`;
    o += `<ellipse cx="66" cy="142" rx="36" ry="32" fill="${F(m, C.blue)}" ${S(m)}/><ellipse cx="134" cy="142" rx="36" ry="32" fill="${F(m, C.blue)}" ${S(m)}/>`;
    o += `<ellipse cx="56" cy="80" rx="46" ry="42" transform="rotate(-15 56 80)" fill="${F(m, C.pink)}" ${S(m)}/>`;
    o += `<ellipse cx="144" cy="80" rx="46" ry="42" transform="rotate(15 144 80)" fill="${F(m, C.pink)}" ${S(m)}/>`;
    if (!m) o += `<g fill="#fff" opacity=".9"><circle cx="46" cy="74" r="11"/><circle cx="154" cy="74" r="11"/><circle cx="60" cy="148" r="8"/><circle cx="140" cy="148" r="8"/></g>`;
    o += `<ellipse cx="100" cy="124" rx="16" ry="50" fill="${F(m, "#9d8ad1")}" ${S(m)}/>`;
    o += `<circle cx="100" cy="62" r="27" fill="${F(m, "#c4b3f2")}" ${S(m)}/>`;
    if (!m) o += face(100, 62, 0.62);
    return o;
  },
  chick(m) {
    let o = "";
    o += `<path d="M96 52 Q92 32 80 28" fill="none" ${S(m)}/><path d="M102 52 Q106 30 120 26" fill="none" ${S(m)}/>`;
    o += `<path d="M82 176 L82 192 M74 194 L90 194 M118 176 L118 192 M110 194 L126 194" ${S(m || C.orange, 5)}/>`;
    o += `<ellipse cx="164" cy="124" rx="15" ry="24" transform="rotate(25 164 124)" fill="${F(m, "#ffc93a")}" ${S(m)}/>`;
    o += `<circle cx="100" cy="116" r="64" fill="${F(m, "#ffe066")}" ${S(m)}/>`;
    if (!m) {
      o += face(100, 106, 1, { noMouth: true });
      o += `<path d="M91 118 L109 118 L100 130 Z" fill="${C.orange}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    }
    return o;
  },
  mushroom(m) {
    let o = "";
    o += `<rect x="62" y="92" width="76" height="92" rx="28" fill="${F(m, "#fff3e0")}" ${S(m)}/>`;
    o += `<path d="M22 108 Q22 26 100 26 Q178 26 178 108 Q100 124 22 108 Z" fill="${F(m, "#ff7b7b")}" ${S(m)}/>`;
    if (!m) {
      o += `<g fill="#fff"><circle cx="60" cy="70" r="12"/><circle cx="142" cy="66" r="10"/><circle cx="100" cy="46" r="9"/><circle cx="104" cy="86" r="11"/><circle cx="154" cy="98" r="6"/><circle cx="42" cy="98" r="6"/></g>`;
      o += face(100, 142, 0.85);
    }
    return o;
  },
};
const NAMES = { bee: "Bee", ladybug: "Ladybug", snail: "Snail", frog: "Frog", bunny: "Bunny", hedgehog: "Hedgehog", butterfly: "Butterfly", chick: "Chick", mushroom: "Mushroom" };
const pal = (name, m = null, cls = "") => svg(critters[name](m), "-6 -6 212 212", cls);

// ---------- props ----------
const props = {
  flower() {
    let o = `<path d="M100 120 Q96 160 100 196" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    o += `<ellipse cx="78" cy="170" rx="20" ry="10" transform="rotate(-30 78 170)" fill="${C.green}" stroke="${INK}" stroke-width="4"/>`;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      o += `<circle cx="${100 + 44 * Math.cos(a)}" cy="${84 + 44 * Math.sin(a)}" r="30" fill="${C.pink}" stroke="${INK}" stroke-width="4.5"/>`;
    }
    o += `<circle cx="100" cy="84" r="34" fill="${C.yellow}" stroke="${INK}" stroke-width="4.5"/>` + face(100, 82, 0.8);
    return o;
  },
  leaf() {
    return `<path d="M28 172 Q22 42 176 26 Q170 176 28 172 Z" fill="${C.green}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M28 172 Q90 110 168 36" fill="none" stroke="#5bb357" stroke-width="4" stroke-linecap="round"/>` + face(108, 118, 0.8);
  },
  carrot() {
    return `<path d="M100 40 Q86 14 70 10 M100 40 Q100 12 104 4 M100 40 Q116 16 132 14" fill="none" stroke="#5bb357" stroke-width="9" stroke-linecap="round"/>
      <path d="M100 194 Q86 180 60 70 Q100 40 140 70 Q114 180 100 194 Z" fill="${C.orange}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M74 110 L88 112 M114 140 L126 138 M80 150 L92 152" stroke="#e08a43" stroke-width="4" stroke-linecap="round"/>` + face(100, 92, 0.75);
  },
};

// ---------- small shapes for tokens ----------
function star(cx, cy, R, r, n = 5) {
  let p = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R;
    p.push(`${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`);
  }
  return "M" + p.join(" L") + " Z";
}
const SHAPES = {
  heart: "M50 82 C 20 62 12 45 22 32 C 32 20 46 24 50 34 C 54 24 68 20 78 32 C 88 45 80 62 50 82 Z",
  star: star(50, 53, 34, 15),
  drop: "M50 14 C 50 14 78 46 78 61 A 28 28 0 0 1 22 61 C 22 46 50 14 50 14 Z",
  leaf: "M22 78 C 20 42 46 22 80 20 C 80 56 58 78 22 78 Z",
};
const SORT = [
  { key: "pink", col: C.pink, tint: C.pinkT, shape: "heart", pal: "bunny", word: "Pink" },
  { key: "yellow", col: C.yellow, tint: C.yellowT, shape: "star", pal: "bee", word: "Yellow" },
  { key: "blue", col: C.blue, tint: C.blueT, shape: "drop", pal: "butterfly", word: "Blue" },
  { key: "green", col: C.green, tint: C.greenT, shape: "leaf", pal: "frog", word: "Green" },
];

// ---------- page helpers ----------
let pageNo = 0;
function page(inner, cls = "") {
  pageNo++;
  return `<section class="page ${cls}">${inner}<div class="footer">Little Garden Friends · Sensory Play Set · ${pageNo}</div></section>`;
}
const head = (kicker, title, how) =>
  `<header><span class="kicker">${kicker}</span><h1>${title}</h1>${how ? `<p class="how">${how}</p>` : ""}</header>`;

const pages = [];

// 1. Cover
pages.push(page(`
  <header>
    <span class="kicker">Printable sensory play set</span>
    <h1>Little Garden<br>Friends</h1>
    <div class="sub">Squish, sort, lace, trace &amp; count with nine tiny pals</div>
  </header>
  <div class="parade">${Object.keys(critters).map(k => pal(k)).join("")}</div>
  <div class="boxes">
    <div class="box b1"><h2>What's inside</h2><ol>
      <li><b>Feed the Friends</b> color sorting mat <span class="pg">p.2</span></li>
      <li><b>Sorting tokens</b>: 20 cut-outs in 4 colors &amp; shapes <span class="pg">p.3</span></li>
      <li><b>Ladybug spots</b> play dough mat <span class="pg">p.4</span></li>
      <li><b>Hedgehog spikes</b> play dough mat <span class="pg">p.5</span></li>
      <li><b>Snail shell swirl</b> play dough mat <span class="pg">p.6</span></li>
      <li><b>Shadow match</b> board <span class="pg">p.7</span></li>
      <li><b>Shadow match</b> cards: 9 friends <span class="pg">p.8</span></li>
      <li><b>Lacing cards</b>: heart, cloud, star, apple <span class="pg">p.9</span></li>
      <li><b>Texture trails</b> finger tracing paths <span class="pg">p.10</span></li>
      <li><b>Counting cards</b> 1 to 10 for sensory bins <span class="pg">p.11–12</span></li>
    </ol></div>
    <div class="box b2"><h2>You'll need</h2><ul>
      <li>Play dough (any kind)</li>
      <li>Pom-poms, buttons or big beads</li>
      <li>Yarn or shoelaces + hole punch</li>
      <li>Scissors, glue, salt or sand</li>
      <li>Optional: laminator or sheet protectors</li>
    </ul></div>
    <div class="box b3"><h2>Make it last</h2><ul>
      <li>Print on cardstock</li>
      <li>Laminate the mats so dough wipes off</li>
      <li>Store pieces in a zip bag</li>
      <li>Toss the cards into a rice or bean bin</li>
    </ul></div>
    <div class="box b4"><h2>A grown-up note</h2>
      Pom-poms, beads, dough balls and small cut-outs are choking hazards. Please play alongside little ones, especially under age 3.
      There's no wrong way to play: let them squish, mix colors and tell you stories about the friends.</div>
  </div>
  <div class="grow">${svg(`<ellipse cx="380" cy="150" rx="380" ry="34" fill="${C.greenT}"/>
    <svg x="40" y="20" width="140" height="140" viewBox="0 0 200 200">${props.flower()}</svg>
    <svg x="190" y="50" width="110" height="110" viewBox="-6 -6 212 212">${critters.snail(null)}</svg>
    <svg x="320" y="10" width="140" height="140" viewBox="-6 -6 212 212">${critters.mushroom(null)}</svg>
    <svg x="470" y="55" width="100" height="100" viewBox="-6 -6 212 212">${critters.chick(null)}</svg>
    <svg x="590" y="22" width="130" height="130" viewBox="0 0 200 200">${props.carrot()}</svg>`, "0 0 760 190", "scene")}</div>
`, "cover"));

// 2. Color sort mat
pages.push(page(head("Color sort", "Feed the Friends!",
  "Each friend only eats one color. Fill their bowls with matching pom-poms, buttons or the tokens on the next page.") + `
  <div class="sortgrid">${SORT.map(s => `
    <div class="sortcell">
      ${pal(s.pal, null, "pal")}
      ${svg(`
        <circle cx="150" cy="150" r="140" fill="${s.col}" stroke="${INK}" stroke-width="5"/>
        <circle cx="150" cy="150" r="112" fill="${s.tint}"/>
        <circle cx="150" cy="150" r="112" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
        <g transform="translate(118 196) scale(.64)"><path d="${SHAPES[s.shape]}" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g>
        <text x="150" y="282" text-anchor="middle" font-family="DynaPuff" font-weight="600" font-size="30" fill="#fff" stroke="${INK}" stroke-width="7" paint-order="stroke" stroke-linejoin="round">${s.word}</text>
      `, "0 0 300 300", "bowl")}
    </div>`).join("")}
  </div>
`));

// 3. Tokens
{
  let t = [];
  for (let i = 0; i < 5; i++) for (const s of SORT) t.push(s);
  // gentle shuffle so colors are mixed but deterministic
  const order = [0, 5, 10, 15, 1, 6, 11, 16, 2, 7, 12, 17, 3, 8, 13, 18, 4, 9, 14, 19].map(i => t[(i * 7) % 20]);
  pages.push(page(head("Cut-outs", "Sorting Tokens",
    "Cut out the circles. Sort them by color, by shape, or count how many go in each bowl.") + `
    <div class="grow"><div><div class="scissors">✂ cut on the dashed lines</div><div class="tokens">${order.map(s => svg(`
      <circle cx="50" cy="50" r="48" fill="none" stroke="#c9bdd6" stroke-width="1.4" stroke-dasharray="4 3"/>
      <circle cx="50" cy="50" r="42" fill="${s.col}" stroke="${INK}" stroke-width="3"/>
      <g transform="translate(22 22) scale(.56)"><path d="${SHAPES[s.shape]}" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g>
    `, "0 0 100 100")).join("")}</div></div></div>
  `));
}

// 4. Ladybug dough mat
{
  const spots = [[110, 162], [290, 162], [90, 252], [310, 252], [156, 308], [244, 308], [200, 244]];
  let o = `<ellipse cx="200" cy="215" rx="196" ry="150" transform="rotate(-8 200 215)" fill="${C.greenT}"/>`;
  o += `<path d="M180 40 Q160 6 132 8" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="128" cy="9" r="11" fill="${INK}"/>`;
  o += `<path d="M220 40 Q240 6 268 8" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="272" cy="9" r="11" fill="${INK}"/>`;
  o += `<circle cx="200" cy="86" r="62" fill="${INK}"/>`;
  o += `<circle cx="200" cy="208" r="150" fill="${C.red}" stroke="${INK}" stroke-width="7"/>`;
  o += face(200, 140, 1.6);
  spots.forEach(([x, y], i) => {
    o += `<circle cx="${x}" cy="${y}" r="27" fill="#fff" stroke="${INK}" stroke-width="3.5" stroke-dasharray="7 7" stroke-linecap="round"/>`;
    o += `<text x="${x}" y="${y + 9}" text-anchor="middle" font-family="DynaPuff" font-size="26" fill="#d6cce0">${i + 1}</text>`;
  });
  pages.push(page(head("Play dough mat", "Ladybug Needs Spots!",
    "Roll 7 little dough balls and squish one onto each spot. Count them as you go!") +
    `<div class="grow">${svg(o, "0 0 400 370", "mat")}</div>
    <div class="tipbar"><b>Try this:</b> roll spots in different sizes, or use buttons and pom-poms instead of dough.</div>`));
}

// 5. Hedgehog dough mat
{
  let o = `<ellipse cx="200" cy="318" rx="200" ry="36" fill="${C.greenT}"/>`;
  o += `<ellipse cx="300" cy="312" rx="26" ry="15" fill="${C.cream}" stroke="${INK}" stroke-width="5"/>`;
  o += `<ellipse cx="190" cy="316" rx="26" ry="15" fill="${C.cream}" stroke="${INK}" stroke-width="5"/>`;
  o += `<path d="M110 300 C 100 80 380 50 380 300 Z" fill="#f7eadb" stroke="#c08d60" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>`;
  for (let i = 0; i < 9; i++) {
    const a = (150 - i * 14) * Math.PI / 180;
    const x = 262 + 100 * Math.cos(a), y = 286 - 140 * Math.sin(a);
    o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#e3c9ad"/>`;
  }
  o += `<text x="300" y="276" text-anchor="middle" font-family="DynaPuff" font-size="18" fill="#c9a37f">spikes go here!</text>`;
  o += `<ellipse cx="128" cy="236" rx="96" ry="80" fill="${C.cream}" stroke="${INK}" stroke-width="7"/>`;
  o += `<circle cx="38" cy="244" r="15" fill="${INK}"/>`;
  o += face(132, 226, 1.5);
  o += `<g transform="translate(330 20) scale(.35)">${props.leaf()}</g>`;
  pages.push(page(head("Play dough mat", "Hedgehog's Spikes",
    "Hedgie lost his prickles! Roll dough snakes for spikes, or poke in straws, pipe cleaners or dry spaghetti.") +
    `<div class="grow">${svg(o, "0 0 400 360", "mat")}</div>
    <div class="tipbar"><b>Try this:</b> lay a ball of dough on his back first, then poke the spikes into it. Great for little finger muscles!</div>`));
}

// 6. Snail dough mat
{
  let o = `<ellipse cx="200" cy="332" rx="200" ry="32" fill="${C.greenT}"/>`;
  o += `<path d="M68 210 Q56 160 42 130" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="40" cy="124" r="12" fill="${INK}"/>`;
  o += `<path d="M104 210 Q116 160 126 130" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="128" cy="124" r="12" fill="${INK}"/>`;
  o += `<rect x="36" y="282" width="340" height="52" rx="26" fill="#ffe2ad" stroke="${INK}" stroke-width="7"/>`;
  o += `<circle cx="86" cy="262" r="52" fill="#ffe2ad" stroke="${INK}" stroke-width="7"/>`;
  o += `<rect x="60" y="286" width="60" height="44" fill="#ffe2ad"/>`;
  o += face(84, 260, 1.3);
  const cx = 238, cy = 172;
  o += `<circle cx="${cx}" cy="${cy}" r="132" fill="${C.purpleT}" stroke="${INK}" stroke-width="7"/>`;
  let p = [];
  const turns = 3, steps = 400, maxT = turns * 2 * Math.PI;
  for (let i = 0; i <= steps; i++) {
    const t = maxT * i / steps, r = 8 + t * 5.3;
    p.push(`${(cx + r * Math.cos(t + Math.PI)).toFixed(1)} ${(cy + r * Math.sin(t + Math.PI)).toFixed(1)}`);
  }
  const d = "M" + p.join(" L");
  o += `<path d="${d}" fill="none" stroke="#dccbff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>`;
  o += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="3.5" stroke-dasharray="1 10" stroke-linecap="round"/>`;
  o += `<circle cx="${cx - 8}" cy="${cy}" r="9" fill="${C.pink}" stroke="${INK}" stroke-width="3"/>`;
  pages.push(page(head("Play dough mat", "Snail's Swirly Shell",
    "Roll one looong dough snake. Start at the pink dot and curl it round and round along the swirl.") +
    `<div class="grow">${svg(o, "0 0 400 368", "mat")}</div>
    <div class="tipbar"><b>Try this:</b> trace the swirl with a finger first, then try it with a pipe cleaner or a piece of yarn.</div>`));
}

// 7 & 8. Shadow match
const SHADOW_ORDER = ["frog", "bee", "mushroom", "bunny", "snail", "butterfly", "ladybug", "chick", "hedgehog"];
pages.push(page(head("Shadow match", "Who's Hiding?",
  "Cut out the friend cards on the next page. Place each friend on top of their matching shadow.") + `
  <div class="grow"><div class="grid3">${SHADOW_ORDER.map(k => `<div class="slot">${pal(k, "#d6cce3")}</div>`).join("")}</div></div>
`));
pages.push(page(head("Shadow match", "Friend Cards",
  "Cut along the dashed lines. Shuffle the cards and find each friend's shadow!") + `
  <div class="grow"><div><div class="scissors">✂ cut on the dashed lines</div><div class="grid3">${Object.keys(critters).map(k => `<div class="cut card">${pal(k)}<div class="name">${NAMES[k]}</div></div>`).join("")}</div></div></div>
`));

// 9. Lacing cards
const LACE = [
  { d: "M100 178 C 40 136 10 100 16 66 C 22 32 64 22 100 58 C 136 22 178 32 184 66 C 190 100 160 136 100 178 Z", fill: C.pink, fc: [100, 96] },
  { d: "M48 156 C 14 156 6 116 34 104 C 26 66 70 50 90 72 C 102 38 158 38 162 80 C 194 76 204 122 176 144 C 170 154 162 156 150 156 Z", fill: C.blue, fc: [104, 116] },
  { d: star(100, 108, 96, 46), fill: C.yellow, fc: [100, 112], s: 0.85 },
  { d: "M100 62 C 74 42 22 48 22 102 C 22 154 64 192 100 176 C 136 192 178 154 178 102 C 178 48 126 42 100 62 Z", fill: C.red, fc: [100, 114], apple: true },
];
pages.push(page(head("Lacing cards", "Sew &amp; Lace",
  "Cut out each card and punch a hole on every white dot. Wrap tape around the end of some yarn to make a needle, then weave in and out!") + `
  <div class="grow"><div><div class="scissors">✂ cut on the dashed lines</div><div class="grid2">${LACE.map((L, i) => `<div class="cut">${svg(
    (L.apple ? `<path d="M100 62 Q96 38 110 22" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><ellipse cx="128" cy="34" rx="18" ry="9" transform="rotate(-25 128 34)" fill="${C.green}" stroke="${INK}" stroke-width="4"/>` : "") +
    `<path d="${L.d}" fill="${L.fill}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
     <path class="guide" d="${L.d}" fill="none" stroke="none"/>
     ${face(L.fc[0], L.fc[1], L.s || 1.1)}
     <g class="holes" data-scale=".82" data-cx="${L.fc[0]}" data-cy="${L.fc[1] - 6}"></g>`,
    "0 0 200 200")}</div>`).join("")}</div></div></div>
`));

// 10. Texture trails
{
  const lanes = [
    { from: "bee", to: "flower", kind: "wave", track: C.yellowT, label: "Wavy" },
    { from: "ladybug", to: "leaf", kind: "zig", track: "#ffe1e1", label: "Zig-zag" },
    { from: "bunny", to: "carrot", kind: "loop", track: C.pinkT, label: "Loopy" },
    { from: "snail", to: "mushroom", kind: "bump", track: C.purpleT, label: "Bumpy" },
  ];
  const x0 = 150, x1 = 620, cy = 88;
  function trail(kind) {
    const pts = [], N = 260;
    for (let i = 0; i <= N; i++) {
      const t = i / N; let x = x0 + t * (x1 - x0), y = cy;
      if (kind === "wave") y = cy - 46 * Math.sin(t * Math.PI * 5);
      if (kind === "zig") { const seg = t * 7, k = Math.floor(seg), f = seg - k; const ys = [cy, 40, 136, 40, 136, 40, 136, cy]; y = ys[Math.min(k, 7)] + (ys[Math.min(k + 1, 7)] - ys[Math.min(k, 7)]) * f; }
      if (kind === "loop") { const k = 4, A = (x1 - x0) / (2 * Math.PI * k), b = 40, tt = -Math.PI / 2 + t * 2 * Math.PI * k; x = x0 + A * (tt + Math.PI / 2) - b * Math.sin(tt) - b; y = cy + 6 - b * Math.cos(tt); }
      if (kind === "bump") y = cy + 44 - 88 * Math.abs(Math.sin(t * Math.PI * 4));
      pts.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
    }
    return "M" + pts.join(" L");
  }
  const toArt = (k) => props[k] ? props[k]() : critters[k](null);
  pages.push(page(head("Finger tracing", "Texture Trails",
    "Help each friend get home! Trace with a finger, or squeeze glue on the dotted line and sprinkle salt or sand for a bumpy trail to feel.") + `
    <div class="lanes">${lanes.map(L => {
      const d = trail(L.kind);
      return `<div class="lane">${svg(`
        <path d="${d}" fill="none" stroke="${L.track}" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${d}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-dasharray="0.5 12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${x0}" cy="${L.kind === "bump" ? cy + 44 : cy}" r="10" fill="${C.green}" stroke="${INK}" stroke-width="3"/>
        <svg x="0" y="12" width="140" height="140" viewBox="-6 -6 212 212">${critters[L.from](null)}</svg>
        <svg x="628" y="12" width="140" height="140" viewBox="-6 -6 212 212">${toArt(L.to)}</svg>
        <text x="${(x0 + x1) / 2}" y="168" text-anchor="middle" font-family="DynaPuff" font-size="15" fill="#b3a6c2">${L.label}</text>
      `, "0 0 768 172")}</div>`;
    }).join("")}</div>
  `));
}

// 11 & 12. Counting cards
{
  const WORDS = ["one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  const CYCLE = [
    [C.red, "ladybug"], [C.yellow, "bee"], [C.green, "frog"], [C.pink, "bunny"], [C.purple, "snail"],
    [C.blue, "butterfly"], [C.orange, "hedgehog"], ["#ffcf3a", "chick"], ["#ff7b7b", "mushroom"], [C.purple, "butterfly"],
  ];
  const card = (n) => {
    const [col, who] = CYCLE[n - 1];
    let f = "";
    for (let i = 0; i < 10; i++) {
      const x = 26 + (i % 5) * 50, y = 26 + Math.floor(i / 5) * 50;
      f += `<rect x="${x - 25}" y="${y - 25}" width="50" height="50" fill="none" stroke="#e6dcef" stroke-width="2"/>`;
      f += i < n
        ? `<circle cx="${x}" cy="${y}" r="19" fill="#fff" stroke="${col}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="19" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>`
        : `<circle cx="${x}" cy="${y}" r="5" fill="#eee6f6"/>`;
    }
    f = `<rect x="1" y="1" width="250" height="100" rx="12" fill="#fcfaff" stroke="#d6cce3" stroke-width="3"/>` + f;
    return `<div class="cut countcard">
      <div class="num"><b style="color:${col};-webkit-text-stroke:2.5px ${INK};paint-order:stroke fill">${n}</b><span>${WORDS[n - 1]}</span></div>
      ${svg(f, "-2 -2 256 106", "frame")}
      ${pal(who, null, "mini")}
    </div>`;
  };
  const how = "Cut out the cards and hide them in a rice or bean bin. Dig one out, read the number, then fill the circles with pom-poms or beads.";
  pages.push(page(head("Sensory bin counting", "Count &amp; Fill: 1 to 6", how) +
    `<div class="grow"><div><div class="scissors">✂ cut on the dashed lines</div><div class="countgrid">${[1, 2, 3, 4, 5, 6].map(card).join("")}</div></div></div>`));
  pages.push(page(head("Sensory bin counting", "Count &amp; Fill: 7 to 10",
    "Bonus: use the blank cards to make your own numbers, or draw a friend and count their spots, legs or petals.") +
    `<div class="grow"><div><div class="scissors">✂ cut on the dashed lines</div><div class="countgrid">${[7, 8, 9, 10].map(card).join("")}
      ${[0, 1].map(() => `<div class="cut countcard"><div class="num"><b style="color:#efe8f6;-webkit-text-stroke:2.5px #d6cce3">?</b><span>&nbsp;</span></div>${svg(`<rect x="1" y="1" width="250" height="100" rx="12" fill="#fcfaff" stroke="#d6cce3" stroke-width="3"/>` + Array.from({ length: 10 }, (_, i) => `<circle cx="${26 + (i % 5) * 50}" cy="${26 + Math.floor(i / 5) * 50}" r="19" fill="#fff" stroke="#d6cce3" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round"/>`).join(""), "-2 -2 256 106", "frame")}</div>`).join("")}
    </div></div></div>`));
}

document.getElementById("book").innerHTML = pages.join("");

// lacing holes: evenly spaced points along each outline, pulled inward
document.querySelectorAll(".holes").forEach(g => {
  const guide = g.parentNode.querySelector(".guide");
  const L = guide.getTotalLength();
  const s = +g.dataset.scale, cx = +g.dataset.cx, cy = +g.dataset.cy;
  const n = Math.round(L * s / 25);
  let o = "";
  for (let i = 0; i < n; i++) {
    const p = guide.getPointAtLength(L * i / n);
    const x = cx + (p.x - cx) * s, y = cy + (p.y - cy) * s;
    o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
  }
  g.innerHTML = o;
});
</script>
</body>
</html>
